<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    // ATHG: o jogo só é acessado pela plataforma. Aberto fora de um iframe
    // (link direto, PWA instalado), redireciona para o player da ATHG. Dev local continua livre.
    (function () {
      var h = location.hostname;
      var local = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || /\.local$/.test(h) ||
        /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h) || location.protocol === 'file:';
      if (window.top === window.self && !local) {
        document.documentElement.style.display = 'none';
        location.replace('https://athg.antonycorp11.workers.dev/play/garbage-kingdom');
      }
    })();
  </script>
  <script>
    // ATHG Modo Gravação: com o foco no jogo, ⌘1/⌘2/⌘3 (Ctrl no Windows) trocam a cena do
    // estúdio. Só liga quando o estúdio da ATHG avisa; no player normal nada muda.
    (function () {
      if (window.top === window.self) return;
      var studio = false;
      addEventListener('message', function (e) {
        if (e.source === window.parent && e.data && e.data.type === 'ATHG_STUDIO_ON') studio = true;
      });
      addEventListener('keydown', function (e) {
        if (!studio || !(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey || ['1', '2', '3'].indexOf(e.key) < 0) return;
        e.preventDefault();
        window.parent.postMessage({ type: 'ATHG_STUDIO_KEY', key: e.key }, '*');
      }, true);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b140d" />
  <title>Garbage Kingdom</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%232b2b2e%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23ffb02e%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" />
  
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-inner">
      <div class="logo">GARBAGE<br/><span>KINGDOM</span></div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-text">Empilhando um milhão de coisas...</div>
    </div>
  </div>
  <div id="rotate"><div class="rot-phone"><i></i></div><b>Gire o celular</b><span>Garbage Kingdom é jogado na horizontal</span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
